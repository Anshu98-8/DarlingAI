spring.application.name= DarlingAI

server.servlet.context-path=/darling
server.port = 9010

spring.datasource.url=jdbc:postgresql://localhost:5432/userDB
spring.datasource.username=postgres
spring.datasource.password=Root
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name= org.postgresql.Driver
spring.jpa.show-sql=true

#Stripe.webhook.cli=stripe listen --forward-to http://localhost:9010/darling/webhooks/payment --events=checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed